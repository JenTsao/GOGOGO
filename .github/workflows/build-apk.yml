name: Build APK

# 打包 Android APK：expo prebuild（CNG 生成 android 工程）→ gradle assembleRelease → artifact
# 签名说明：prebuild 模板的 release 构建默认用 debug keystore 签名，产出可直接侧载安装的 APK；
# 正式上架 Google Play 时需自备 keystore 并通过 secrets 注入 signingConfig
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/build-apk.yml'
      - '.npmrc'

# 密集推送时取消排队中的旧构建，只打包最新提交（省并发额度与排队时间）
concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Android APK（release）
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # 自动读取根 package.json 的 packageManager 字段

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖（仅 mobile 及其依赖）
        run: pnpm install --filter @gk/mobile... --no-frozen-lockfile

      - name: 生成 android 工程（CNG prebuild，不提交进仓库）
        working-directory: apps/mobile
        run: npx expo prebuild -p android --no-install --clean

      - name: 对齐 Expo SDK 51 官方工具链（Gradle 8.6；8.7+ 移除的 API 会让 expo-av / expo-modules-core 配置阶段崩溃）
        working-directory: apps/mobile/android
        run: |
          # SDK 51 / RN 0.74 官方配套 Gradle 8.6；wrapper 若生成更高版本则强制钉回（兼容 all/bin 两种分发后缀）
          sed -i 's#gradle-[0-9.]*-all.zip#gradle-8.6-all.zip#' gradle/wrapper/gradle-wrapper.properties
          sed -i 's#gradle-[0-9.]*-bin.zip#gradle-8.6-bin.zip#' gradle/wrapper/gradle-wrapper.properties
          # expo-av 旧式 classifier 写法在 Gradle 8.7+ 报 unknown property，统一改 archiveClassifier（8.6 下等价）
          # hoisted 布局下 pnpm 把依赖提升到仓库根 node_modules，用 find 兜底定位实际安装位置
          AV_GRADLE="$(find "$GITHUB_WORKSPACE/node_modules" -maxdepth 3 -path '*/expo-av/android/build.gradle' 2>/dev/null | head -n1)"
          if [ -n "$AV_GRADLE" ]; then
            sed -i 's/\bclassifier\b/archiveClassifier/g' "$AV_GRADLE"
            echo "patched: $AV_GRADLE"
          else
            echo "::warning::未找到 expo-av build.gradle，跳过 classifier patch"
          fi

      - name: 调优 gradle 构建（runner 4 核 16G：加大 JVM、并行、启用 build cache）
        working-directory: apps/mobile/android
        run: |
          sed -i 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g/' gradle.properties
          grep -q '^org.gradle.parallel' gradle.properties || echo 'org.gradle.parallel=true' >> gradle.properties
          grep -q '^org.gradle.caching' gradle.properties || echo 'org.gradle.caching=true' >> gradle.properties

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17 # RN 0.74 / AGP 8.x 要求 JDK 17
          cache: gradle # 缓存 ~/.gradle：依赖包 + build cache 产物（配合 org.gradle.caching 二次构建任务级 FROM-CACHE）

      - name: 接受 Android SDK 许可（runner 预装 SDK）
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: gradle 打包 release APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease --no-daemon --build-cache --stacktrace

      - name: 上传 APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: gaokao-copilot-apk
          path: apps/mobile/android/app/build/outputs/apk/release/*.apk
          retention-days: 30
          if-no-files-found: error
